<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peer-Hosted Arena Shooter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <section id="lobby" class="panel">
      <h1>Peer-Hosted Arena Shooter</h1>
      <p>Host a room and share its code, or join a friend.</p>

      <div class="row">
        <button id="hostBtn">Host Game</button>
      </div>

      <div class="join">
        <input id="joinCode" aria-label="Host code" placeholder="Host code" spellcheck="false" />
        <button id="joinBtn">Join Game</button>
      </div>

      <p id="status" role="status">Not connected.</p>
      <p class="small">
        Controls: WASD/arrows move · mouse aims · left click shoots · host simulates the match.
      </p>
    </section>

    <section id="gameWrap" class="hidden">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="Arena: WASD or arrows to move, mouse to aim, left click to shoot"></canvas>
      <div class="hud">
        <button id="leaveBtn" type="button">Leave room</button>
        <div id="gameStatus" role="status"></div>
        <div id="roomInfo">Room: —</div>
        <div id="stats">Players: 0 · Enemies: 0 · Score: 0</div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
